<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Criar Conta</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(0, 0, 0, 0.65);
      padding: 30px;
      width: 100%;
      max-width: 360px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,.6);
      animation: fadeIn 0.6s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    input::placeholder {
      color: #666;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,114,255,.6);
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #bbb;
      text-decoration: none;
      font-size: 14px;
    }

    .voltar:hover {
      color: #fff;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📝 Criar Conta</h2>

    <form action="/register" method="post">
      <input name="key" placeholder="🔑 Key de acesso" required>
      <input name="usuario" placeholder="👤 Usuário" required>
      <input type="password" name="senha" placeholder="🔒 Senha" required>
      <button>Criar Conta</button>
    </form>

    <a class="voltar" href="/">← Voltar para o login</a>
  </div>

</body>
</html>

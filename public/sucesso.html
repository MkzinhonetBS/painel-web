<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login realizado</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .check {
      font-size: 50px;
      color: #00ff88;
      margin-bottom: 15px;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>

  <!-- redireciona sozinho -->
  <meta http-equiv="refresh" content="2;url=/painel">
</head>
<body>

  <div class="card">
    <div class="check">✔</div>
    <h2>Login realizado com sucesso</h2>
    <p>Redirecionando para o painel...</p>
  </div>

</body>
</html>
